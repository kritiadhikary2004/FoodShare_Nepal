<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Donations | FoodShare Nepal</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9, #ffffff);
            padding-bottom: 50px;
        }

        header {
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }

        nav {
            width: 90%;
            max-width: 1200px;
            height: 75px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #2e7d32;
        }

        .back-btn {
            text-decoration: none;
            color: #444;

            padding: 9px 20px;

            border: 1px solid #ddd;
            border-radius: 25px;

            font-size: 14px;
        }

        .back-btn:hover {
            background: #2e7d32;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .heading {
            text-align: center;
            margin-bottom: 40px;
        }

        .heading h1 {
            font-size: 38px;
            color: #222;
            margin-bottom: 10px;
        }

        .heading h1 span {
            color: #2e7d32;
        }

        .heading p {
            color: #666;
            font-size: 15px;
        }

        .donation-card {
            background: white;
            padding: 25px;

            margin-bottom: 20px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.08);
        }

        .donation-card h2 {
            color: #2e7d32;
            margin-bottom: 12px;
        }

        .donation-card p {
            color: #555;
            margin: 6px 0;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 50px 20px;
            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.08);
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #777;
        }

    </style>

</head>

<body>

<header>

    <nav>

        <div class="logo">
            FoodShare
        </div>

        <a href="/donor" class="back-btn">
            ← Dashboard
        </a>

    </nav>

</header>


<main class="container">

    <div class="heading">

        <h1>
            My <span>Donations</span> 📦
        </h1>

        <p>
            View the food you have shared with
            the FoodShare community.
        </p>

    </div>


    <div class="empty">

        <h2>
            Your Donations
        </h2>

        <p>
            Your donated food will appear here.
        </p>

    </div>

</main>

</body>

</html>
