<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Available Food | FoodShare Nepal</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: "Poppins", sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #dff5e3 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #e8f5e9 0%,
                    transparent 35%
                ),
                #f8fbf8;

            color: #333;

            padding-bottom: 60px;
        }


        /* ================= HEADER ================= */

        header {

            background: rgba(255,255,255,0.88);

            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(46,125,50,0.08);

            position: sticky;

            top: 0;

            z-index: 100;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.05);
        }


        nav {

            width: 90%;

            max-width: 1200px;

            height: 78px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .logo {

            display: flex;

            align-items: center;

            gap: 11px;

            font-size: 23px;

            font-weight: 600;

            color: #2e7d32;

            letter-spacing: -0.5px;
        }


        .logo-icon {

            width: 43px;

            height: 43px;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #c8e6c9
                );

            border-radius: 50%;

            font-size: 21px;

            box-shadow:
                0 5px 15px rgba(46,125,50,0.12);
        }


        .back {

            display: flex;

            align-items: center;

            gap: 6px;

            text-decoration: none;

            padding: 10px 20px;

            border: 1px solid #c8e6c9;

            border-radius: 30px;

            color: #2e7d32;

            font-size: 14px;

            font-weight: 500;

            background: white;

            transition: all 0.3s ease;
        }


        .back:hover {

            background: #2e7d32;

            color: white;

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(46,125,50,0.20);
        }


        /* ================= MAIN ================= */

        .container {

            width: 90%;

            max-width: 1150px;

            margin: 55px auto;
        }


        /* ================= HEADING ================= */

        .heading {

            text-align: center;

            margin-bottom: 45px;

            animation: fadeDown 0.7s ease;
        }


        .heading-badge {

            display: inline-block;

            padding: 7px 16px;

            background: #e8f5e9;

            color: #2e7d32;

            border-radius: 30px;

            font-size: 12px;

            font-weight: 500;

            margin-bottom: 15px;

            border: 1px solid #c8e6c9;
        }


        .heading h1 {

            font-size: 38px;

            font-weight: 600;

            color: #1f2933;

            margin-bottom: 10px;

            letter-spacing: -1px;
        }


        .heading h1 span {

            color: #2e7d32;
        }


        .heading p {

            color: #777;

            font-size: 15px;

            max-width: 600px;

            margin: auto;

            line-height: 1.7;
        }


        /* ================= FOOD GRID ================= */

        .food-container {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 28px;
        }


        /* ================= FOOD CARD ================= */

        .food-card {

            position: relative;

            background:
                rgba(255,255,255,0.95);

            padding: 30px;

            border-radius: 24px;

            border: 1px solid
                rgba(46,125,50,0.10);

            box-shadow:
                0 12px 35px
                rgba(46,125,50,0.08);

            overflow: hidden;

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease;

            animation: fadeUp 0.7s ease;
        }


        /* decorative circle */

        .food-card::before {

            content: "";

            position: absolute;

            width: 150px;

            height: 150px;

            background: #e8f5e9;

            border-radius: 50%;

            top: -75px;

            right: -55px;

            opacity: 0.65;

            transition: 0.4s;
        }


        .food-card:hover {

            transform: translateY(-8px);

            box-shadow:
                0 20px 45px
                rgba(46,125,50,0.15);
        }


        .food-card:hover::before {

            transform: scale(1.25);
        }


        /* ================= FOOD ICON ================= */

        .food-icon {

            position: relative;

            width: 65px;

            height: 65px;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #f1f8e9,
                    #e8f5e9
                );

            border-radius: 18px;

            font-size: 30px;

            margin-bottom: 20px;

            box-shadow:
                0 7px 18px
                rgba(46,125,50,0.08);
        }


        .food-card h2 {

            position: relative;

            color: #2e7d32;

            margin-bottom: 18px;

            font-size: 22px;

            font-weight: 600;
        }


        /* ================= DETAILS ================= */

        .details {

            position: relative;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-top: 10px;
        }


        .detail {

            background: #f8faf8;

            padding: 12px 14px;

            border-radius: 12px;

            border: 1px solid #edf3ed;
        }


        .detail-label {

            display: block;

            color: #999;

            font-size: 11px;

            margin-bottom: 4px;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }


        .detail-value {

            color: #444;

            font-size: 13px;

            font-weight: 500;
        }


        /* ================= DESCRIPTION ================= */

        .description {

            position: relative;

            margin-top: 15px;

            padding: 13px 15px;

            background: #f7faf7;

            border-left:
                3px solid #66bb6a;

            border-radius: 10px;

            color: #666;

            font-size: 13px;

            line-height: 1.6;
        }


        /* ================= REQUEST BUTTON ================= */

        .request-btn {

            position: relative;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 22px;

            padding: 11px 24px;

            background:
                linear-gradient(
                    135deg,
                    #43a047,
                    #2e7d32
                );

            color: white;

            text-decoration: none;

            border-radius: 30px;

            font-size: 13px;

            font-weight: 500;

            box-shadow:
                0 7px 18px
                rgba(46,125,50,0.20);

            transition: all 0.3s ease;
        }


        .request-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 25px
                rgba(46,125,50,0.30);

            background:
                linear-gradient(
                    135deg,
                    #2e7d32,
                    #1b5e20
                );
        }


        /* ================= EMPTY ================= */

        .empty {

            grid-column: 1 / -1;

            background:
                rgba(255,255,255,0.9);

            padding: 65px 30px;

            text-align: center;

            border-radius: 25px;

            border: 1px solid #e0f2e1;

            box-shadow:
                0 12px 35px
                rgba(0,0,0,0.06);

            animation: fadeUp 0.7s ease;
        }


        .empty-icon {

            width: 85px;

            height: 85px;

            margin: 0 auto 20px;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #e8f5e9;

            border-radius: 50%;

            font-size: 40px;
        }


        .empty h2 {

            color: #2e7d32;

            margin-bottom: 10px;

            font-size: 22px;
        }


        .empty p {

            color: #777;

            font-size: 14px;
        }


        /* ================= ANIMATIONS ================= */

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        @keyframes fadeDown {

            from {

                opacity: 0;

                transform:
                    translateY(-15px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 750px) {

            .food-container {

                grid-template-columns: 1fr;
            }

            .heading h1 {

                font-size: 30px;
            }

            .details {

                grid-template-columns: 1fr;
            }

            nav {

                width: 88%;
            }

            .logo {

                font-size: 19px;
            }

            .back {

                padding: 8px 15px;
            }
        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <nav>

        <div class="logo">

            <div class="logo-icon">
                🍃
            </div>

            FoodShare Nepal

        </div>


        <a
            href="/receiver"
            class="back"
        >
            ← Dashboard
        </a>

    </nav>

</header>



<!-- ================= MAIN ================= -->

<main class="container">


    <section class="heading">

        <div class="heading-badge">
            🤝 Helping Hands • Shared Meals
        </div>

        <h1>
            Available <span>Food</span> 🍱
        </h1>

        <p>
            Discover food shared by generous donors
            and help reduce food waste in our community.
        </p>

    </section>



    <!-- ================= FOOD CARDS ================= -->

    <section class="food-container">


        <!--
            FOOD CARDS WILL BE LOADED
            FROM DATABASE
        -->


        <div class="empty">

            <div class="empty-icon">
                🍱
            </div>

            <h2>
                Loading Available Food...
            </h2>

            <p>
                Please wait while we find
                available donations for you.
            </p>

        </div>


    </section>


</main>


</body>

</html>
