<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | FoodShare Nepal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #ffffff
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .login-container {

            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.1);
        }

        h1 {

            text-align: center;

            color: #2e7d32;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {

            outline: none;

            border-color: #2e7d32;
        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 25px;

            background: #2e7d32;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #1b5e20;
        }

        .register {

            text-align: center;

            margin-top: 20px;

            color: #666;
        }

        .register a {

            color: #2e7d32;

            text-decoration: none;

            font-weight: bold;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #555;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to FoodShare Nepal
        </p>

        <form action="/login" method="POST">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="register">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </p>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
