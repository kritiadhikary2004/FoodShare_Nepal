<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | FoodShare Nepal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #f1f8e9,
                    #ffffff
                );

            position: relative;

            overflow: hidden;
        }

        /* Background circles */

        body::before,
        body::after {

            content: "";

            position: absolute;

            border-radius: 50%;

            background: rgba(76, 175, 80, 0.12);

            z-index: 0;
        }

        body::before {

            width: 300px;
            height: 300px;

            top: -100px;
            left: -100px;
        }

        body::after {

            width: 350px;
            height: 350px;

            bottom: -150px;
            right: -100px;
        }


        /* Login Card */

        .login-container {

            width: 100%;
            max-width: 420px;

            background: rgba(255, 255, 255, 0.95);

            padding: 45px 40px;

            border-radius: 24px;

            box-shadow:
                0 20px 50px
                rgba(46, 125, 50, 0.15);

            position: relative;

            z-index: 1;

            border: 1px solid
                rgba(255, 255, 255, 0.8);

            animation: fadeIn 0.6s ease;
        }


        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: translateY(20px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        /* Logo */

        .logo {

            width: 65px;
            height: 65px;

            margin: 0 auto 18px;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #e8f5e9;

            border-radius: 50%;

            font-size: 32px;

            box-shadow:
                0 8px 20px
                rgba(46, 125, 50, 0.12);
        }


        h1 {

            text-align: center;

            color: #1b5e20;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 15px;

            margin-bottom: 32px;
        }


        /* Form */

        .form-group {

            margin-bottom: 20px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #333;

            font-size: 14px;

            font-weight: bold;
        }


        input {

            width: 100%;

            padding: 14px 15px;

            border: 1px solid #d6d6d6;

            border-radius: 10px;

            font-size: 15px;

            background: #fafafa;

            transition: 0.3s;
        }


        input:focus {

            outline: none;

            border-color: #43a047;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(67, 160, 71, 0.10);
        }


        /* Login Button */

        button {

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2e7d32,
                    #43a047
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 8px 18px
                rgba(46, 125, 50, 0.25);
        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(46, 125, 50, 0.30);
        }


        button:active {

            transform: translateY(0);
        }


        /* Register */

        .register {

            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 14px;
        }


        .register a {

            color: #2e7d32;

            text-decoration: none;

            font-weight: bold;

            margin-left: 4px;
        }


        .register a:hover {

            text-decoration: underline;
        }


        /* Back */

        .back {

            display: block;

            width: fit-content;

            margin: 18px auto 0;

            color: #666;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s;
        }


        .back:hover {

            color: #2e7d32;

            transform: translateX(-3px);
        }


        /* Mobile */

        @media (max-width: 480px) {

            .login-container {

                padding: 35px 25px;

                border-radius: 20px;
            }

            h1 {

                font-size: 26px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <div class="logo">
            🍃
        </div>


        <h1>
            Welcome Back
        </h1>


        <p class="subtitle">
            Login to continue with FoodShare Nepal
        </p>


        <form action="/login" method="POST">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>


        </form>


        <p class="register">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </p>


        <a href="/" class="back">
            ← Back to Home
        </a>


    </div>


</body>

</html>
