
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | FoodShare Nepal</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(circle at top left, #c8e6c9, transparent 35%),
                radial-gradient(circle at bottom right, #dcedc8, transparent 35%),
                linear-gradient(135deg, #f1f8e9, #ffffff);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        /* ================= REGISTER CARD ================= */

        .register-container {
            width: 100%;
            max-width: 520px;

            background: rgba(255, 255, 255, 0.96);

            padding: 42px 45px;

            border-radius: 28px;

            box-shadow:
                0 20px 60px rgba(46, 125, 50, 0.14);

            border: 1px solid rgba(200, 230, 201, 0.8);

            animation: slideUp 0.7s ease;
        }

        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* ================= LOGO ================= */

        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;

            font-size: 30px;
            font-weight: 700;

            color: #2e7d32;

            margin-bottom: 8px;
        }

        .logo-icon {

            width: 45px;
            height: 45px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #e8f5e9;

            border-radius: 50%;

            font-size: 23px;

            box-shadow:
                0 6px 15px rgba(46, 125, 50, 0.12);
        }

        /* ================= HEADING ================= */

        .heading {
            text-align: center;

            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 27px;

            color: #222;

            margin-bottom: 7px;

            font-weight: 600;
        }

        .heading p {
            color: #777;

            font-size: 13px;

            line-height: 1.6;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #333;

            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {

            position: absolute;

            left: 14px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 16px;

            opacity: 0.7;
        }

        .form-group input {

            width: 100%;

            padding: 13px 15px 13px 43px;

            border: 1px solid #d9e5da;

            border-radius: 12px;

            background: #fbfefb;

            font-size: 13px;

            color: #333;

            outline: none;

            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .form-group input:focus {

            border-color: #43a047;

            background: white;

            box-shadow:
                0 0 0 4px rgba(67, 160, 71, 0.10);

            transform: translateY(-1px);
        }

        /* ================= REGISTER BUTTON ================= */

        .register-btn {

            width: 100%;

            padding: 14px;

            margin-top: 7px;

            border: none;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #2e7d32,
                    #43a047
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(46, 125, 50, 0.20);

            transition: all 0.3s ease;
        }

        .register-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(46, 125, 50, 0.28);

            background:
                linear-gradient(
                    135deg,
                    #1b5e20,
                    #2e7d32
                );
        }

        .register-btn:active {
            transform: translateY(0);
        }

        /* ================= LOGIN ================= */

        .login-text {

            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #777;
        }

        .login-text a {

            color: #2e7d32;

            text-decoration: none;

            font-weight: 600;

            margin-left: 3px;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* ================= BACK HOME ================= */

        .back-home {

            display: block;

            text-align: center;

            margin-top: 16px;

            color: #999;

            text-decoration: none;

            font-size: 12px;

            transition: 0.3s;
        }

        .back-home:hover {
            color: #2e7d32;
        }

        /* ================= DIVIDER ================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 22px 0 0;

            color: #aaa;

            font-size: 11px;
        }

        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #e5eee6;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            body {
                padding: 25px 15px;
            }

            .register-container {

                padding: 32px 23px;

                border-radius: 22px;
            }

            .logo {
                font-size: 26px;
            }

            .heading h1 {
                font-size: 24px;
            }

            .form-group {
                margin-bottom: 15px;
            }

        }

    </style>

</head>

<body>

    <div class="register-container">

        <!-- LOGO -->

        <div class="logo">

            <div class="logo-icon">
                🍃
            </div>

            FoodShare

        </div>


        <!-- HEADING -->

        <div class="heading">

            <h1>
                Create Your Account
            </h1>

            <p>
                Join FoodShare Nepal and help make a difference.
            </p>

        </div>


        <!-- REGISTER FORM -->

        <form id="registerForm" method="POST">

            <!-- ROLE -->

            <input
                type="hidden"
                name="role"
                id="role"
            >


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        ✉️
                    </span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        📱
                    </span>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        📍
                    </span>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter your location"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔐
                    </span>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="register-btn"
            >

                Create Account

            </button>

        </form>


        <div class="divider">
            Already a member?
        </div>


        <!-- LOGIN -->

        <p class="login-text">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>


        <!-- HOME -->

        <a
            href="/"
            class="back-home"
        >
            ← Back to Home
        </a>

    </div>


    <!-- ROLE SCRIPT -->

    <script>

        const params =
            new URLSearchParams(window.location.search);

        const role =
            params.get("role");

        document.getElementById("role").value =
            role || "receiver";

    </script>

</body>

</html>
